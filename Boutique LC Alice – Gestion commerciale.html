<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Boutique LC Alice – Gestion commerciale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f1;--cd:#fff;--tx:#17262b;--mu:#5b6b70;--pr:#0d5c63;--pt:#fff;--bd:#d3dcdb;--wa:#b4531a;--ok:#1f7a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1719;--cd:#182326;--tx:#e6eeee;--mu:#98aaad;--pr:#4fb6bd;--pt:#06191b;--bd:#2a3a3d;--wa:#f2a56b;--ok:#6fd3a1}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1719;--cd:#182326;--tx:#e6eeee;--mu:#98aaad;--pr:#4fb6bd;--pt:#06191b;--bd:#2a3a3d;--wa:#f2a56b;--ok:#6fd3a1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{padding:14px 16px 0}header h1{margin:0;font-size:20px;letter-spacing:.2px}header p{margin:2px 0 10px;color:var(--mu);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pr);border-color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button,.btn{background:var(--pr);color:var(--pt);border:0;border-radius:6px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.s,.btn.s{background:none;color:var(--pr);border:1px solid var(--pr)}button.x{background:none;color:var(--wa);padding:2px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
td.r,th.r{text-align:right}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.k div{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px}.k b{display:block;font-size:22px;margin-top:2px}.k span{color:var(--mu);font-size:13px}
.neg{color:var(--wa);font-weight:600}.pos{color:var(--ok);font-weight:600}.mu{color:var(--mu)}
body.vend button.x{display:none}#pa{display:none}@media print{body>*:not(#pa){display:none}#pa{display:block;padding:20px;color:#000;background:#fff}}
</style></head><body>
<header><h1>Boutique LC Alice</h1><p>Prêt-à-porter, chaussures, accessoires et cosmétiques</p></header>
<nav id="nv"></nav><main id="v"></main><div id="pa"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const K='lcalice_v1';let D={prods:[],mouv:[],inv:[],clients:[],fact:[],regl:[],rec:[],dep:[],clot:[],four:[],achats:[],rfour:[],init:{}},T='home',cart=[];
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}pushDB()};
const $=s=>document.querySelector(s),v=i=>$('#'+i).value.trim(),n=i=>+$('#'+i).value||0,today=()=>new Date().toISOString().slice(0,10);
const f=x=>(Math.round(x*100)/100).toLocaleString('fr-FR'),m=x=>f(x)+' F';
const H=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const P=r=>D.prods.find(p=>p.ref===r),C=i=>D.clients.find(c=>c.id===i);
const tb=(h,r,id)=>`<div class="w"><table${id?' id="'+id+'"':''}><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')||'<tr><td class="mu" colspan="'+h.length+'">Aucune donnée pour le moment.</td></tr>'}</tbody></table></div>`;
const cl=(c,d)=>`<td>${H(c)}</td>`;
function stk(r,lim,st){const ok=d=>!lim||(st?d<lim:d<=lim);const iv=D.inv.filter(x=>x.ref===r&&ok(x.date));let d='',i=D.init[r]||0,ic=null,av=0;
if(iv.length){d=iv.reduce((a,x)=>x.date>a?x.date:a,'');const L=iv.filter(x=>x.date===d);i=ic=L.reduce((a,x)=>a+x.qte,0);av=L.reduce((a,x)=>a+(x.av||0),0)}
let e=0,s=0,ve=0;D.mouv.forEach(x=>{if(x.ref===r&&x.date>d&&ok(x.date))x.type==='E'?e+=x.qte:s+=x.qte});
D.fact.forEach(F=>{if(F.date>d&&ok(F.date))F.lignes.forEach(l=>{if(l.ref===r)ve+=l.qte})});
return{i,e,s,ve,t:i+e-s-ve,ic,av,d}}
function ecart(r,d,q){if(!D.inv.some(x=>x.ref===r&&x.date<d)&&D.init[r]==null)return null;return q-stk(r,d,true).t}
function solde(c){let s=c.s0||0;D.fact.forEach(F=>{if(F.cid===c.id)s+=F.total-F.paye});D.regl.forEach(r=>{if(r.cid===c.id)s-=r.montant});return s}
const opts=(a,fn)=>a.map(fn).join('');
const del=(k,id)=>{if(ROLE!=='patron')return;if(!confirm('Supprimer cette ligne ?'))return;D[k]=D[k].filter(x=>x.id!==id);save();render()};
const flt=i=>{const q=i.value.toLowerCase();document.querySelectorAll('#tp tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};
const TABS={home:'Tableau de bord',prods:'Produits',stock:'Stock',fact:'Facturation',ach:'Achats et fournisseurs',cli:'Clients et créances',rec:'Autres recettes',caisse:'Caisse du jour',rap:'Rapports',inv:'Inventaire',data:'Données'};
const V={
home(){const mo=today().slice(0,7);let val=0,rup=[];D.prods.forEach(p=>{const t=stk(p.ref).t;val+=Math.max(t,0)*(p.cout||p.pu||0);if(t<=(p.min||0))rup.push(p)});
const ven=D.fact.filter(F=>F.date.startsWith(mo)).reduce((a,F)=>a+F.total,0),cre=D.clients.reduce((a,c)=>a+Math.max(solde(c),0),0),rc=D.rec.filter(r=>r.date.startsWith(mo)).reduce((a,r)=>a+r.montant,0);
return `<div class="k"><div><span>Produits référencés</span><b>${D.prods.length}</b></div><div><span>Valeur du stock</span><b>${m(val)}</b></div><div><span>Ventes du mois</span><b>${m(ven)}</b></div><div><span>Créances clients</span><b>${m(cre)}</b></div><div><span>Dettes fournisseurs</span><b>${m(D.four.reduce((a,c)=>a+Math.max(sdF(c),0),0))}</b></div><div><span>Autres recettes du mois</span><b>${m(rc)}</b></div><div><span>Produits à réapprovisionner</span><b class="${rup.length?'neg':''}">${rup.length}</b></div></div>
${D.prods.length?'':'<div class="card"><h3>Pour commencer</h3><p>Ouvrez <b>Produits</b> puis importez votre fichier Excel (feuille BASE PRODUITS ou liste REF / DESIGNATION). Saisissez ensuite les stocks initiaux, ou entrez votre inventaire dans <b>Inventaire</b>.</p></div>'}
<div class="card"><h3>À réapprovisionner</h3>${tb(['Réf.','Désignation','Stock'],rup.slice(0,15).map(p=>`<tr><td>${H(p.ref)}</td><td>${H(p.des)}</td><td class="r neg">${f(stk(p.ref).t)}</td></tr>`))}</div>`},
prods(){return `<div class="card"><h3>Ajouter ou modifier un produit</h3><div class="g"><input id="pr" placeholder="Référence"><input id="pd" placeholder="Désignation"><input id="pp" type="number" placeholder="Prix de vente"><input id="pc" type="number" placeholder="Coût d’achat"><input id="pi" type="number" placeholder="Stock initial"><input id="pm" type="number" placeholder="Seuil d’alerte"><input id="pq" type="number" placeholder="Unités par carton"><input id="pl" list="dl" placeholder="Réf. unité liée"></div>
<button onclick="addP()">Enregistrer le produit</button> <label class="btn s">Importer un fichier Excel ou CSV<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="impX(this)"></label></div>
<div class="card"><input placeholder="Rechercher un produit…" oninput="flt(this)" style="margin-bottom:10px">${tb(['Réf.','Désignation','Prix vente','Coût achat','Marge','Stock initial','Stock actuel','Seuil','Colisage',''],D.prods.map(p=>`<tr><td>${H(p.ref)}</td><td>${H(p.des)}</td><td class="r">${f(p.pu)}</td><td class="r">${f(p.cout)}</td><td class="r ${p.pu&&p.pu<p.cout?'neg':''}">${p.pu?f((p.pu-p.cout)/p.pu*100)+' %':'–'}</td><td class="r">${f(D.init[p.ref]||0)}</td><td class="r">${f(stk(p.ref).t)}</td><td class="r">${f(p.min||0)}</td><td>${p.col?p.col+' → '+H(p.lie||''):''}</td><td><button class="x" onclick="delP(this.dataset.r)" data-r="${H(p.ref)}">Supprimer</button></td></tr>`),'tp')}</div>`},
stock(){return `<div class="card"><h3>Entrée ou sortie de stock</h3><div class="g"><input id="md" type="date" value="${today()}">${pk("mr")}<select id="mt"><option value="E">Entrée (achat)</option><option value="S">Sortie (perte, casse, don)</option></select><input id="mq" type="number" placeholder="Quantité"><input id="mn" placeholder="Note"></div><button onclick="addM()">Enregistrer le mouvement</button></div>
<div class="card"><h3>Ouvrir des cartons en unités</h3><p class="mu">Renseignez d’abord le colisage du produit (Produits : unités par carton et référence liée).</p><div class="g">${pk("cr")}<input id="cq" type="number" placeholder="Nombre de cartons"></div><button class="s" onclick="conv()">Convertir en unités</button></div>
<div class="card"><h3>État des stocks</h3>${tb(['Réf.','Désignation','Départ','Entrées','Sorties','Ventes','Stock théorique','Inventaire','Écart','Valeur'],D.prods.map(p=>{const s=stk(p.ref),e=s.ic==null?null:ecart(p.ref,s.d,s.ic);return `<tr><td>${H(p.ref)}</td><td>${H(p.des)}</td><td class="r">${f(s.i)}</td><td class="r">${f(s.e)}</td><td class="r">${f(s.s)}</td><td class="r">${f(s.ve)}</td><td class="r ${s.t<=0?'neg':''}">${f(s.t)}</td><td class="r">${s.ic==null?'–':f(s.ic)}</td><td class="r ${e?'neg':''}">${e==null?'–':f(e)}</td><td class="r">${m(Math.max(s.t,0)*(p.cout||p.pu||0))}</td></tr>`}))}</div>
<div class="card"><h3>Derniers mouvements</h3>${tb(['Date','Réf.','Type','Qté','Note',''],D.mouv.slice(-20).reverse().map(x=>`<tr><td>${x.date}</td><td>${H(x.ref)}</td><td>${x.type==='E'?'Entrée':'Sortie'}</td><td class="r">${f(x.qte)}</td><td>${H(x.note)}</td><td><button class="x" onclick="del('mouv','${x.id}')">Supprimer</button></td></tr>`))}</div>`},
fact(){const tot=cart.reduce((a,l)=>a+l.qte*l.pu,0);
return `<div class="card"><h3>Nouvelle facture</h3><div class="g"><select id="fc"><option value="">Client comptoir</option>${opts(D.clients,c=>`<option value="${c.id}">${H(c.nom)}</option>`)}</select><input id="fd" type="date" value="${today()}"></div>
<div class="g">${pk("lr")}<input id="lq" type="number" placeholder="Quantité"><input id="lp" type="number" placeholder="Prix unitaire"></div><button class="s" onclick="addL()">Ajouter la ligne</button>
${tb(['Réf.','Désignation','Qté','PU','Total',''],cart.map((l,i)=>`<tr><td>${H(l.ref)}</td><td>${H(l.des)}</td><td class="r">${f(l.qte)}</td><td class="r">${f(l.pu)}</td><td class="r">${m(l.qte*l.pu)}</td><td><button class="x" onclick="cart.splice(${i},1);render()">Retirer</button></td></tr>`))}
<p><b>Total : ${m(tot)}</b></p><div class="g"><input id="fp" type="number" placeholder="Montant payé maintenant"></div><button onclick="valF()">Valider la facture</button></div>
<div class="card"><h3>Factures émises</h3>${tb(['N°','Date','Client','Total','Payé','Reste',''],D.fact.slice().reverse().map(F=>`<tr><td>${F.num}</td><td>${F.date}</td><td>${H(F.cnom)}</td><td class="r">${m(F.total)}</td><td class="r">${m(F.paye)}</td><td class="r ${F.total-F.paye>0?'neg':''}">${m(F.total-F.paye)}</td><td><button class="s" onclick="prtF('${F.id}')">Imprimer</button> <button class="x" onclick="del('fact','${F.id}')">Supprimer</button></td></tr>`))}</div>`},
cli(){return `<div class="card"><h3>Nouveau client</h3><div class="g"><input id="cn" placeholder="Nom du client"><input id="ct" placeholder="Téléphone"><input id="cs" type="number" placeholder="Solde initial dû"></div><button onclick="addC()">Enregistrer le client</button></div>
<div class="card"><h3>Règlement client</h3><div class="g"><select id="rc">${opts(D.clients,c=>`<option value="${c.id}">${H(c.nom)}</option>`)}</select><input id="rd" type="date" value="${today()}"><input id="rm" type="number" placeholder="Montant"><select id="rt"><option>Espèces</option><option>Mobile money</option><option>Virement</option><option>Chèque</option></select></div><button onclick="addR()">Enregistrer le règlement</button></div>
<div class="card"><h3>Créances clients</h3>${tb(['Client','Téléphone','Solde dû',''],D.clients.map(c=>`<tr><td>${H(c.nom)}</td><td>${H(c.tel)}</td><td class="r ${solde(c)>0?'neg':'pos'}">${m(solde(c))}</td><td><button class="x" onclick="del('clients','${c.id}')">Supprimer</button></td></tr>`))}</div>
<div class="card"><h3>Historique des règlements</h3>${tb(['Date','Client','Mode','Montant',''],D.regl.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${H((C(r.cid)||{}).nom)}</td><td>${H(r.mode)}</td><td class="r">${m(r.montant)}</td><td><button class="x" onclick="del('regl','${r.id}')">Supprimer</button></td></tr>`))}</div>`},
rap(){const F=D.fact.filter(x=>x.date>=rd1&&x.date<=rd2),M={},S={};let ca=0,mg=0;
F.forEach(x=>{S[x.date]=(S[x.date]||0)+x.total;x.lignes.forEach(l=>{const p=P(l.ref)||{},o=M[l.ref]=M[l.ref]||{q:0,ca:0,mg:0},g=l.qte*(l.pu-(p.cout||0));o.q+=l.qte;o.ca+=l.qte*l.pu;o.mg+=g;ca+=l.qte*l.pu;mg+=g})});
const L=Object.keys(M).map(k=>[k,M[k]]).sort((a,b)=>b[1].ca-a[1].ca),dorm=D.prods.filter(p=>!M[p.ref]&&stk(p.ref).t>0),days=Object.keys(S).sort(),mx=Math.max(1,...days.map(d=>S[d])),w=Math.max(300,days.length*34);
const svg=days.length?`<div class="w"><svg viewBox="0 0 ${w} 170" width="${w}" role="img" aria-label="Ventes par jour">${days.map((d,i)=>{const h=Math.round(S[d]/mx*120);return `<rect x="${i*34+6}" y="${135-h}" width="24" height="${h}" rx="3" fill="var(--pr)"><title>${d} : ${m(S[d])}</title></rect><text x="${i*34+18}" y="152" font-size="9" text-anchor="middle" fill="var(--mu)">${d.slice(5)}</text>`}).join('')}</svg></div>`:'<p class="mu">Aucune vente sur la période.</p>';
return `<div class="card"><h3>Période</h3><div class="g"><input type="date" value="${rd1}" onchange="rd1=this.value;render()"><input type="date" value="${rd2}" onchange="rd2=this.value;render()"></div>
<div class="k"><div><span>Chiffre d’affaires</span><b>${m(ca)}</b></div><div><span>Marge réalisée</span><b class="pos">${m(mg)}</b></div><div><span>Taux de marge</span><b>${ca?f(mg/ca*100)+' %':'–'}</b></div><div><span>Factures</span><b>${F.length}</b></div></div>
<p class="mu">La marge utilise le coût d’achat actuel de chaque produit.</p></div>
<div class="card"><h3>Évolution des ventes</h3>${svg}</div>
<div class="card"><h3>Ventes par produit</h3>${tb(['Réf.','Désignation','Qté','Chiffre d’affaires','Marge'],L.slice(0,50).map(x=>`<tr><td>${H(x[0])}</td><td>${H((P(x[0])||{}).des)}</td><td class="r">${f(x[1].q)}</td><td class="r">${m(x[1].ca)}</td><td class="r ${x[1].mg<0?'neg':''}">${m(x[1].mg)}</td></tr>`))}</div>
<div class="card"><h3>Produits en stock sans vente (${dorm.length})</h3>${tb(['Réf.','Désignation','Stock','Valeur'],dorm.slice(0,50).map(p=>{const t=stk(p.ref).t;return `<tr><td>${H(p.ref)}</td><td>${H(p.des)}</td><td class="r">${f(t)}</td><td class="r">${m(t*(p.cout||0))}</td></tr>`}))}</div>`},
caisse(){const c=cj(cdate),o=ouv(cdate),att=o+c.enc-c.dec,cl=D.clot.find(x=>x.date===cdate);
return `<div class="card"><h3>Journée</h3><div class="g"><input id="cdt" type="date" value="${cdate}" onchange="cdate=this.value;render()"></div>
<div class="k"><div><span>Ouverture (dernière clôture)</span><b>${m(o)}</b></div><div><span>Encaissements</span><b class="pos">${m(c.enc)}</b></div><div><span>Décaissements</span><b class="neg">${m(c.dec)}</b></div><div><span>Caisse attendue</span><b>${m(att)}</b></div></div>
${tb(['Opération','Détail','Montant'],c.R.map(x=>`<tr><td>${H(x[0])}</td><td>${H(x[1])}</td><td class="r ${x[2]<0?'neg':'pos'}">${m(x[2])}</td></tr>`))}</div>
<div class="card"><h3>Dépense</h3><div class="g"><input id="dl2" placeholder="Libellé (transport, salaire, électricité…)"><input id="dm" type="number" placeholder="Montant"></div><button onclick="addDep()">Enregistrer la dépense</button> <span class="mu">Datée du ${cdate}.</span></div>
<div class="card"><h3>Clôture de la journée</h3>${cl?`<p>Clôturée : compté ${m(cl.compte)}, écart <b class="${cl.compte-cl.att?'neg':'pos'}">${m(cl.compte-cl.att)}</b>. Vous pouvez la refaire.</p>`:''}<div class="g"><input id="kc" type="number" placeholder="Montant compté en caisse"><input id="kn" placeholder="Note"></div><button onclick="clo()">Clôturer la journée</button></div>
<div class="card"><h3>Dépenses et clôtures</h3>${tb(['Date','Libellé','Montant',''],D.dep.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${H(r.libelle)}</td><td class="r">${m(r.montant)}</td><td><button class="x" onclick="del('dep','${r.id}')">Supprimer</button></td></tr>`))}${tb(['Clôture','Attendu','Compté','Écart',''],D.clot.slice().sort((a,b)=>a.date<b.date?1:-1).map(x=>`<tr><td>${x.date}</td><td class="r">${m(x.att)}</td><td class="r">${m(x.compte)}</td><td class="r ${x.compte-x.att?'neg':'pos'}">${m(x.compte-x.att)}</td><td><button class="x" onclick="del('clot','${x.id}')">Supprimer</button></td></tr>`))}</div>`},
ach(){const tot=achC.reduce((a,l)=>a+l.qte*l.cout,0),fo=opts(D.four,c=>`<option value="${c.id}">${H(c.nom)}</option>`);
return `<div class="card"><h3>Nouveau fournisseur</h3><div class="g"><input id="fn" placeholder="Nom du fournisseur"><input id="ft" placeholder="Téléphone"><input id="fs" type="number" placeholder="Dette initiale"></div><button onclick="addF()">Enregistrer le fournisseur</button></div>
<div class="card"><h3>Réception d’achat</h3><div class="g"><select id="af">${fo}</select><input id="ad" type="date" value="${today()}"></div><div class="g">${pk("ar")}<input id="aq" type="number" placeholder="Quantité reçue"><input id="ac" type="number" placeholder="Coût unitaire"></div><button class="s" onclick="addAL()">Ajouter la ligne</button>
${tb(['Réf.','Désignation','Qté','Coût','Total',''],achC.map((l,i)=>`<tr><td>${H(l.ref)}</td><td>${H(l.des)}</td><td class="r">${f(l.qte)}</td><td class="r">${f(l.cout)}</td><td class="r">${m(l.qte*l.cout)}</td><td><button class="x" onclick="achC.splice(${i},1);render()">Retirer</button></td></tr>`))}
<p><b>Total : ${m(tot)}</b></p><div class="g"><input id="ap" type="number" placeholder="Montant payé maintenant"></div><button onclick="valA()">Valider la réception</button> <span class="mu">Le stock augmente et le coût d’achat du produit est mis à jour.</span></div>
<div class="card"><h3>Règlement fournisseur</h3><div class="g"><select id="rf">${fo}</select><input id="rd2" type="date" value="${today()}"><input id="rm2" type="number" placeholder="Montant"><select id="rt2"><option>Espèces</option><option>Mobile money</option><option>Virement</option><option>Chèque</option></select></div><button onclick="addRF()">Enregistrer le règlement</button></div>
